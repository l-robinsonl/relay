name: CI

on:
  push:
    # Both names deliberately: this workflow sat dormant for a week
    # because it watched `main` while the branch was `master`.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no point finishing a run nobody
# will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the one job that needs more says so itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # This job installs no GTK/WebKit, so it covers the library crates
      # only. The desktop job below builds the shell with those present.
      - name: Test
        run: cargo test --workspace --exclude relay-desktop --all-features

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --exclude relay-desktop --all-targets -- -D warnings

      # A change to a Rust type must be accompanied by regenerated bindings,
      # or the frontend is compiling against a contract that no longer exists.
      - name: Bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test -p relay-models -p relay-core export_bindings
          git diff --exit-code -- packages/shared-types/src/generated \
            || { echo "::error::Run 'npm run bindings' and commit the result."; exit 1; }

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libsoup-3.0-dev \
            pkg-config build-essential curl wget file

      - run: npm ci
      - name: Build the desktop application
        run: npm run tauri build -- --no-bundle

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # audit-check reports through a check run, which it cannot create
    # under the default read-only token.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Advisories in dev-only tooling should not block a pull request; the
      # job still reports them.
      - run: npm audit --audit-level=high --omit=dev

name: CI

on:
  push:
    # Both names deliberately: this workflow sat dormant for a week
    # because it watched `main` while the branch was `master`.
    branches: [master, main]
    # A release tag gets the full matrix; see `choose_runners`.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"


# A second push supersedes the first; no point finishing a run nobody
# will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the one job that needs more says so itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Decides which runners this run uses. A cheap Linux job so the
  # decision is made once and both matrices agree.
  choose_runners:
    name: Choose runners
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
            || [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo 'matrix=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "Running the full matrix."
          else
            echo 'matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo "Linux only. macOS and Windows run weekly, on a tag, or on request."
          fi

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux on every push; the others only when
        # `choose_runners` says so. On a private repository macOS bills at 10x and
        # Windows at 2x, and the two macOS jobs alone came to roughly
        # a tenth of a free month's allowance per commit. Linux
        # catches nearly everything; what it misses — a path
        # separator, a line ending, a platform-gated dependency —
        # does not change between Monday and Friday.
        os: ${{ fromJSON(needs.choose_runners.outputs.matrix) }}
    needs: [choose_runners]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # This job installs no GTK/WebKit, so it covers the library crates
      # only. The desktop job below builds the shell with those present.
      - name: Test
        run: cargo test --workspace --exclude relay-desktop --all-features

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --exclude relay-desktop --all-targets -- -D warnings

      # A change to a Rust type must be accompanied by regenerated bindings,
      # or the frontend is compiling against a contract that no longer exists.
      - name: Bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test -p relay-models -p relay-core -p relay-sync -p relay-script export_bindings
          git diff --exit-code -- packages/shared-types/src/generated \
            || { echo "::error::Run 'npm run bindings' and commit the result."; exit 1; }

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.choose_runners.outputs.matrix) }}
    needs: [choose_runners]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libsoup-3.0-dev \
            pkg-config build-essential curl wget file

      - run: npm ci
      - name: Build the desktop application
        run: npm run tauri build -- --no-bundle

  image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A typo in a deployment file shows up as a failed deploy at the
      # least convenient moment, so it is parsed here instead.
      - name: Deployment files parse
        run: |
          python3 - <<'PY'
          import yaml
          # The workflow itself is in the list: a syntax error in it
          # shows up as a run that never starts, which on a repository
          # with a billing problem is indistinguishable from the
          # billing problem.
          for path in ['docker-compose.yml', 'deploy/compose.prod.yml', 'render.yaml',
                       '.github/workflows/ci.yml']:
              with open(path) as handle:
                  yaml.safe_load(handle)
              print(f'{path}: ok')
          PY

      - uses: docker/setup-buildx-action@v3

      # Built here rather than only written, because a Dockerfile that
      # nobody builds rots quietly and is discovered by whoever is
      # trying to deploy.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: relay-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually starts and serves, which a build alone
      # does not: a missing CA bundle or an unwritable data directory
      # only shows up at runtime.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name relay -p 8787:8787 relay-server:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health > /tmp/health.json; then
              echo "healthy after ${attempt}s"
              cat /tmp/health.json
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::the container never became healthy"
              docker logs relay
              exit 1
            fi
            sleep 1
          done

          # It must run unprivileged: a sync server is reachable from a
          # network, and root in the container is one bug from root on
          # the host.
          whoami_in_container="$(docker exec relay whoami)"
          echo "running as: ${whoami_in_container}"
          [ "${whoami_in_container}" = "relay" ] || {
            echo "::error::the image runs as ${whoami_in_container}, not relay"
            exit 1
          }

          # And SIGTERM must stop it promptly, or every deploy waits out
          # the orchestrator's kill timeout.
          start=$(date +%s)
          docker stop --timeout 15 relay > /dev/null
          echo "stopped in $(( $(date +%s) - start ))s"
          docker logs relay 2>&1 | tail -5

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # audit-check reports through a check run, which it cannot create
    # under the default read-only token.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Advisories in dev-only tooling should not block a pull request; the
      # job still reports them.
      - run: npm audit --audit-level=high --omit=dev

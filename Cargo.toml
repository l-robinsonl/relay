[workspace]
resolver = "3"
members = [
    "crates/relay-models",
    "crates/relay-http",
    "crates/relay-storage",
    "crates/relay-core",
    "crates/relay-app",
    "crates/relay-sync",
    "crates/relay-script",
    "server",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/relay-api/relay"
authors = ["Relay contributors"]

[workspace.dependencies]
relay-models = { path = "crates/relay-models" }
relay-http = { path = "crates/relay-http" }
relay-storage = { path = "crates/relay-storage" }
relay-core = { path = "crates/relay-core" }
relay-app = { path = "crates/relay-app" }
relay-sync = { path = "crates/relay-sync" }
relay-script = { path = "crates/relay-script" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
futures-util = "0.3.34"
bytes = "1.12"
url = "2.5.8"
percent-encoding = "2.3.2"
mime_guess = "2.0.5"
base64 = "0.23.1"
tracing = "0.1.44"
ts-rs = { version = "12.0", features = ["serde-json-impl", "no-serde-warnings"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Dependencies of our dependencies stay optimised even in dev, so that
# debug builds of the HTTP engine and SQLite are not unusably slow.
[profile.dev.package."*"]
opt-level = 2

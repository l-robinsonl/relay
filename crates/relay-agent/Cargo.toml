[package]
name = "relay-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The assistant: an agent loop, its tools, and the providers behind it."

[dependencies]
relay-models.workspace = true
# For the server-sent events parser. Streaming replies arrive as SSE
# from every provider, and the one in relay-http already handles the
# chunk boundaries that make writing a second one a mistake.
relay-http.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
ts-rs.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
futures-util.workspace = true
# The official Rust MCP SDK. Hand-rolling JSON-RPC framing, the stdio
# child-process transport and the initialize handshake would be a few
# hundred lines of protocol nobody should write twice.
#
# `server` is off: Relay is a client of other people's MCP servers, not
# one itself. `transport-child-process` is what runs a local server;
# `transport-streamable-http-client` reaches a remote one.
rmcp = { version = "3.7", default-features = false, features = [
    "client",
    "transport-child-process",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
axum = "0.8"

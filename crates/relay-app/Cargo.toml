[package]
name = "relay-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Relay application services: the logic behind every Tauri command."

[dependencies]
relay-models.workspace = true
relay-core.workspace = true
relay-http.workspace = true
relay-storage.workspace = true
relay-sync.workspace = true
uuid.workspace = true
rusqlite = { version = "0.39", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
dirs = "7.0"
futures-util.workspace = true
tokio-tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
axum = "0.8"
relay-server = { path = "../../server" }

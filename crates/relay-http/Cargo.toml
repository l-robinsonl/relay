[package]
name = "relay-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Relay's native HTTP execution engine."

[dependencies]
relay-models.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util.workspace = true
futures-util.workspace = true
bytes.workspace = true
url.workspace = true
base64.workspace = true
mime_guess.workspace = true
tracing.workspace = true
thiserror.workspace = true
encoding_rs = "0.8.42"
sha2 = "0.11"
getrandom = "0.3"
percent-encoding.workspace = true
tokio-tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

[dependencies.reqwest]
version = "0.13"
default-features = false
features = [
    "rustls",        # pulls rustls-platform-verifier: OS trust store, no OpenSSL build dep
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "multipart",
    "form",
    "stream",
    "charset",
    "http2",
    "socks",
    "system-proxy",
]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-stream = "0.1"
axum = { version = "0.8", features = ["ws"] }

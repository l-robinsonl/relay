[package]
name = "relay-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local SQLite persistence for Relay."

[dependencies]
relay-models.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
# Pinned to 0.39 rather than 0.40: 0.40 requires libsqlite3-sys 0.38, while
# sqlx-sqlite (used by the server) requires <0.38. Both link the native
# sqlite3 library, so the workspace can only contain one version. 0.39 is the
# newest release that lets the desktop app and the server share a workspace.
rusqlite = { version = "0.39", features = ["bundled", "backup"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
